name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Write COVERAGE.md
        if: always() && hashFiles('coverage/test-results.json') != ''
        run: |
          npm run report
          cat COVERAGE.md >> "$GITHUB_STEP_SUMMARY"

      # Only main publishes the file, so feature branches never conflict over it.
      - name: Commit COVERAGE.md
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('COVERAGE.md') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COVERAGE.md
          git diff --staged --quiet || { git commit -m "docs: update coverage report [skip ci]" && git push; }
